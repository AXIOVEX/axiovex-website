name: Website operations (Meta Muse replacement)
on:
  schedule:
    # Both UTC offsets; calendar.mjs gates by America/New_York local hour.
    - cron: '39 12 * * *'
    - cron: '39 13 * * *'
    - cron: '39 14 * * *'
    - cron: '39 15 * * *'
  workflow_dispatch:
    inputs:
      task:
        type: choice
        required: true
        options: [daily, weekly, health, newsletter-draft, workforce]
  push:
    branches: [main]
    paths: ['**.html', '**.js', '**.mjs', 'robots.txt', 'sitemap.xml', 'llms.txt', '.github/workflows/operations*.yml']
  pull_request:
    paths: ['scripts/ops/**', 'functions/api/ops/**', '.github/workflows/operations*.yml']
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/ops/*.test.mjs
  calendar:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.calendar.outputs.tasks }}
      active: ${{ steps.calendar.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: calendar
        env:
          REQUESTED_TASK: ${{ github.event_name == 'push' && 'health' || inputs.task }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: node scripts/ops/calendar.mjs
  report:
    needs: calendar
    if: needs.calendar.outputs.active == 'true'
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.calendar.outputs.tasks) }}
    concurrency:
      group: website-operations-${{ matrix.task }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned AEO checker for report audits
        if: contains(fromJSON('["daily","weekly","health"]'), matrix.task)
        run: |
          npm install --prefix "$RUNNER_TEMP/axiovex-aeo" --no-audit --no-fund aeo.js@0.0.16
          echo "OPS_AEO_CLI=$RUNNER_TEMP/axiovex-aeo/node_modules/aeo.js/dist/cli.mjs" >> "$GITHUB_ENV"
      - name: Analytics
        if: contains(fromJSON('["daily","weekly"]'), matrix.task)
        env:
          CADENCE: ${{ matrix.task }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          NEWSLETTER_SEND_SECRET: ${{ secrets.NEWSLETTER_SEND_SECRET }}
        run: node scripts/ops/run-report.mjs "$CADENCE"
      - name: Live technical SEO and crawler checks
        if: matrix.task == 'health'
        run: node scripts/ops/health.mjs
      - name: Newsletter candidates
        if: matrix.task == 'newsletter-draft'
        run: node scripts/ops/newsletter.mjs draft
      - name: Checkout public workforce evidence source
        if: matrix.task == 'workforce'
        uses: actions/checkout@v4
        with:
          repository: AXIOVEX/michigan-workforce-intelligence
          path: workforce-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: matrix.task == 'workforce'
        with:
          python-version: '3.12'
      - name: Execute workforce study
        if: matrix.task == 'workforce'
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: bash scripts/ops/workforce.sh
      - name: Email report to founders through Microsoft 365
        if: always() && contains(fromJSON('["daily","weekly","workforce","newsletter-draft"]'), matrix.task)
        env:
          NEWSLETTER_SEND_SECRET: ${{ secrets.NEWSLETTER_SEND_SECRET }}
          REPORT_KIND: ${{ matrix.task }}
        run: node scripts/ops/mail.mjs
      - name: Preserve report and raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops-output/
          if-no-files-found: warn
          retention-days: 90
