name: Website operations (Meta Muse replacement)
on:
  schedule:
    # Both UTC offsets; calendar.mjs gates by America/New_York local hour.
    - cron: '39 12,13,14,15 * * *'
    - cron: '0 14,15 * * 3'
  workflow_dispatch:
    inputs:
      task:
        type: choice
        required: true
        options: [daily, weekly, monthly, health, newsletter-draft, newsletter-send, workforce]
      issue_date:
        description: Today's approved newsletter issue (YYYY-MM-DD); send only
        type: string
  push:
    branches: [main]
    paths: ['**.html', '**.js', '**.mjs', 'robots.txt', 'sitemap.xml', 'llms.txt', '.github/workflows/operations*.yml']
  pull_request:
    paths: ['scripts/ops/**', '.github/workflows/operations*.yml']
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/ops/*.test.mjs
  calendar:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.calendar.outputs.tasks }}
      active: ${{ steps.calendar.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: calendar
        env:
          REQUESTED_TASK: ${{ github.event_name == 'push' && 'health' || inputs.task }}
        run: node scripts/ops/calendar.mjs
  report:
    needs: calendar
    if: needs.calendar.outputs.active == 'true'
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.calendar.outputs.tasks) }}
    concurrency:
      group: website-operations-${{ matrix.task }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analytics
        if: contains(fromJSON('["daily","weekly","monthly"]'), matrix.task)
        env:
          CADENCE: ${{ matrix.task }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          REPORT_GMAIL_CLIENT_ID: ${{ secrets.REPORT_GMAIL_CLIENT_ID }}
          REPORT_GMAIL_CLIENT_SECRET: ${{ secrets.REPORT_GMAIL_CLIENT_SECRET }}
          REPORT_GMAIL_REFRESH_TOKEN: ${{ secrets.REPORT_GMAIL_REFRESH_TOKEN }}
        run: node scripts/ops/analytics.mjs "$CADENCE"
      - name: Live technical SEO and crawler checks
        if: matrix.task == 'health'
        run: node scripts/ops/health.mjs
      - name: Newsletter candidates
        if: matrix.task == 'newsletter-draft'
        run: node scripts/ops/newsletter.mjs draft
      - name: Refuse duplicate or uncertain newsletter send attempts
        if: matrix.task == 'newsletter-send'
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_DATE: ${{ inputs.issue_date }}
        run: |
          date=$(TZ=America/New_York date +%F)
          if [ -n "$ISSUE_DATE" ] && [ "$ISSUE_DATE" != "$date" ]; then
            echo 'Only today may be sent'; exit 1
          fi
          name="newsletter-attempt-$date"
          matches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name" --jq '.artifacts[].name')
          if [ -n "$matches" ]; then
            echo 'An attempt already exists. Inspect the server sends ledger; CI will not retry a possibly partial send.'; exit 1
          fi
          mkdir -p send-reservation
          printf '%s\n' "$GITHUB_RUN_ID" > send-reservation/run-id.txt
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Validate issue before reserving a send attempt
        if: matrix.task == 'newsletter-send'
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
          NEWSLETTER_SEND_SECRET: ${{ secrets.NEWSLETTER_SEND_SECRET }}
        run: node scripts/ops/newsletter.mjs validate
      - name: Persist send attempt before external side effects
        if: matrix.task == 'newsletter-send'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reserve.outputs.name }}
          path: send-reservation/
          retention-days: 90
      - name: Send exact owner-approved issue
        if: matrix.task == 'newsletter-send'
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
          NEWSLETTER_SEND_SECRET: ${{ secrets.NEWSLETTER_SEND_SECRET }}
        run: node scripts/ops/newsletter.mjs send
      - name: Checkout public workforce evidence source
        if: matrix.task == 'workforce'
        uses: actions/checkout@v4
        with:
          repository: AXIOVEX/michigan-workforce-intelligence
          path: workforce-source
          persist-credentials: false
      - name: Execute workforce study
        if: matrix.task == 'workforce'
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: bash scripts/ops/workforce.sh
      - name: Email founder analytics report
        if: always() && contains(fromJSON('["daily","weekly","monthly"]'), matrix.task)
        env:
          REPORT_GMAIL_CLIENT_ID: ${{ secrets.REPORT_GMAIL_CLIENT_ID }}
          REPORT_GMAIL_CLIENT_SECRET: ${{ secrets.REPORT_GMAIL_CLIENT_SECRET }}
          REPORT_GMAIL_REFRESH_TOKEN: ${{ secrets.REPORT_GMAIL_REFRESH_TOKEN }}
        run: node scripts/ops/mail.mjs
      - name: Preserve report and raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops-output/
          if-no-files-found: warn
          retention-days: 90
