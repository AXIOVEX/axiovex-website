name: Monthly report (after economic releases)
on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: monthly-economic-report
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.plan.outputs.active }}
      dataMonth: ${{ steps.plan.outputs.dataMonth }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: plan
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: node scripts/ops/month-end.mjs plan
  report:
    needs: plan
    if: needs.plan.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
      NEWSLETTER_SEND_SECRET: ${{ secrets.NEWSLETTER_SEND_SECRET }}
      PACK_STATUS_FILE: ops-output/economic-refresh.json
      REPORT_DATA_MONTH: ${{ needs.plan.outputs.dataMonth }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify automation before refreshing sources
        run: node --test scripts/ops/*.test.mjs
      - name: Refresh current state, county and analysis inputs (runner-local, never committed)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DOL_API_KEY: ${{ secrets.DOL_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          node scripts/fetch-signals.mjs
          node scripts/fetch-geo.mjs laus
          node scripts/fetch-pack.mjs
      - name: Require released data for the intended month
        id: economic
        run: node scripts/ops/month-end.mjs check
      - name: Install locked independent SEO and AEO audit tools
        if: steps.economic.outputs.ready == 'true'
        run: |
          npm ci --prefix scripts/ops/audit-tools --ignore-scripts --no-audit --no-fund
          echo "OPS_AEO_CLI=$GITHUB_WORKSPACE/scripts/ops/audit-tools/node_modules/aeo.js/dist/cli.mjs" >> "$GITHUB_ENV"
          echo "OPS_SEO_MODULE_ROOT=$GITHUB_WORKSPACE/scripts/ops/audit-tools/node_modules" >> "$GITHUB_ENV"
      - name: Build monthly report including website health
        if: steps.economic.outputs.ready == 'true'
        run: node scripts/ops/run-report.mjs monthly
      - name: Email the monthly report to the founders through Microsoft 365
        if: steps.economic.outputs.ready == 'true'
        env:
          REPORT_KIND: monthly
        run: node scripts/ops/mail.mjs
      - name: Keep data-gate, report and email evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: month-end-report-${{ needs.plan.outputs.dataMonth }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops-output/
          if-no-files-found: warn
          retention-days: 90
