name: Data pack sync (spec 019)

# Keeps the external-data analysis pack current (spec 019):
#   - scripts/fetch-pack.mjs pulls the configured Tier 1 / Tier 2
#     sources into data/pack/<source>.json (rewritten only when the
#     content actually changed; failed sources keep last-good files;
#     sources whose API key secret is absent are skipped)
# The bot commits only when something changed. The pack is an
# analysis input for reporting — it is not rendered on the site.

on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:
    inputs:
      source:
        type: choice
        default: all
        options: [all, bea, census, dol-claims, eia, fred, jolts, scorecard]

permissions:
  contents: write

concurrency:
  group: site-content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch analysis pack
        id: pack
        continue-on-error: true
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DOL_API_KEY: ${{ secrets.DOL_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          PACK_STATUS_FILE: ops-output/economic-refresh.json
          SOURCE_ID: ${{ inputs.source || 'all' }}
        run: |
          if [ "$SOURCE_ID" = all ]; then
            node scripts/fetch-pack.mjs
          else
            node scripts/fetch-pack.mjs --only "$SOURCE_ID"
          fi

      - name: Refresh county data and rebuild public Signals insights
        id: geo
        continue-on-error: true
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          GEO_STATUS_FILE=ops-output/geo-refresh.json node scripts/fetch-geo.mjs laus

      - name: Recompute insights from all successful refreshed inputs
        run: node scripts/build-site.mjs

      - name: Preserve source refresh status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economic-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops-output/*refresh.json
          retention-days: 90

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "pack unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "Data pack refresh (automated)"
          git pull --rebase --quiet origin main
          git push origin main || (git pull --rebase --quiet origin main && git push origin main)

      - name: Fail visibly on collector failure after preserving last-good content
        if: steps.pack.outcome == 'failure' || steps.geo.outcome == 'failure'
        run: exit 1
