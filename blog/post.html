<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article | Axiovex Systems Blog</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#081F32">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    body { background: #081F32; color: #F7FCFF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; }
    main { max-width: 640px; margin: 18vh auto 0; padding: 0 24px; text-align: center; }
    a { color: #00DEF6; }
  </style>
  <script>
    // Articles now live at /blog/<slug>/ — this shim preserves every old
    // /blog/post?p=<slug> link (shares, the LinkedIn comment, older sitemaps).
    (function () {
      var m = /[?&]p=([A-Za-z0-9-]+)/.exec(location.search);
      if (m) location.replace('/blog/' + m[1] + '/');
    })();
  </script>
</head>
<body>
  <main>
    <p>This article has moved to the <a href="/blog/">Axiovex Systems blog</a>.</p>
  </main>
</body>
</html>
